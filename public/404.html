<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page Not Found | Left Hook Strategy</title>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0A0A0A;color:#F0EEE9;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  main{max-width:560px}
  h1{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:clamp(56px,12vw,112px);line-height:.95;letter-spacing:.04em;margin:0 0 20px}
  p{font-size:18px;line-height:1.5;margin:0 0 32px;opacity:.8}
  a{color:#6B8FC7;text-decoration:none;font-weight:500;border-bottom:1px solid currentColor;padding-bottom:2px}
  a:hover,a:focus-visible{color:#F0EEE9}
</style>
</head>
<body>
<main>
  <h1>PAGE NOT FOUND</h1>
  <p>That page doesn't exist or has moved on.</p>
  <a href="/">Back to the homepage</a>
</main>
</body>
</html>
